version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/neurallearn
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      - db
      - ml-service

  ml-service:
    build: ./ml-service
    ports:
      - '8001:8001'

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=neurallearn
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
